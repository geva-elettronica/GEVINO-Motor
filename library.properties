name=GEVINO Motor
version=1.0.0
author=Giorgio - GEVA Elettronica
maintainer=GEVA Elettronica <info@gevaelettronica.it>
sentence=Support library for the GEVINO Motor PLC (SAMD21, Arduino Zero compatible) with a Toshiba TB67S128FTG motor driver.
paragraph=Single-header library for the GEVINO Motor PLC: Toshiba TB67S128FTG stepper/brushed-DC control (init sequence, microstepping with sine tables, ADMD, brushed mode), PNP input/output macros, on-board LEDs, RS485 transmit-enable, non-blocking ADC polling with motor-current sensing, low-level SAMD21 ADC helpers and a non-blocking Timer class. Include a Sinewave*.h table before the header. No external dependencies for the core library.
category=Device Control
url=https://github.com/gioreva/GEVINO-Motor
architectures=samd
includes=gevino_motor.h
